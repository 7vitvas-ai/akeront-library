<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Витрина — Библиотека Akeront</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .header p {
      color: #64748b;
    }
    .book-card {
      display: flex;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .book-cover {
      width: 220px;
      min-width: 220px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .book-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
    }
    .book-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    .book-prologue {
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .btn-read {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0284c7;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      width: fit-content;
    }
    .btn-read:hover {
      background: #0369a1;
    }
    @media (max-width: 640px) {
      .book-card {
        flex-direction: column;
      }
      .book-cover {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Библиотека Akeront</h1>
      <p>Авторская проза и исследования — Каталог произведений</p>
    </div>

    <div id="books-list">Загрузка каталога...</div>
  </div>

  <script>
    async function loadBooks() {
      const container = document.getElementById('books-list');
      try {
        const response = await fetch('/api/books');
        const books = await response.json();

        if (!books.length) {
          container.innerHTML = '<p>Книги не найдены.</p>';
          return;
        }

        container.innerHTML = books.map(book => `
          <div class="book-card">
            <img class="book-cover" src="${book.cover_url}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/220x330?text=No+Cover'">
            <div class="book-content">
              <div>
                <h2 class="book-title">${book.title}</h2>
                <div class="book-prologue">${book.prologue_html}</div>
              </div>
              <a href="${book.pdf_url}" target="_blank" class="btn-read">
                📄 Read PDF
              </a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p>Ошибка загрузки списка книг.</p>';
        console.error(err);
      }
    }

    loadBooks();
  </script>
</body>
</html>
