<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Витрина — Библиотека Akeront</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
    .container { max-width: 850px; margin: 0 auto; }
    .book-card { display: flex; background: #1e293b; border-radius: 12px; margin-bottom: 24px; overflow: hidden; border: 1px solid #334155; }
    .book-cover { width: 200px; min-width: 200px; object-fit: cover; }
    .book-info { padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .book-title { font-size: 1.5rem; margin: 0 0 12px 0; color: #38bdf8; }
    .prologue { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; max-height: 200px; overflow-y: auto; margin-bottom: 20px; }
    .btn-login { background: #0284c7; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; width: fit-content; }
    .btn-login:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align: center; margin-bottom: 40px;">Витрина Библиотеки Akeront</h1>
    <div id="catalog">Загрузка произведений...</div>
  </div>

  <script>
    async function loadCatalog() {
      const res = await fetch('/api/books');
      const books = await res.json();
      const catalog = document.getElementById('catalog');

      catalog.innerHTML = books.map(book => `
        <div class="book-card">
          <img class="book-cover" src="${book.cover_url}" alt="${book.title}">
          <div class="book-info">
            <div>
              <h2 class="book-title">${book.title}</h2>
              <div class="prologue">${book.prologue_html}</div>
            </div>
            <a href="/index.html?book=${encodeURIComponent(book.pdf_url)}" class="btn-login">🔑 Получить доступ и читать</a>
          </div>
        </div>
      `).join('');
    }
    loadCatalog();
  </script>
</body>
</html>
