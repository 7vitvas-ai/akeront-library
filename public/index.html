<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Читальня — Akeront</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* Блокировка выделения текста */
    * { -webkit-user-select: none; -moz-user-select: none; ms-user-select: none; user-select: none; }
    body { background: #111827; color: white; font-family: sans-serif; margin: 0; padding: 0; }
    
    /* Форма авторизации */
    #auth-screen { max-width: 400px; margin: 80px auto; padding: 30px; background: #1f2937; border-radius: 12px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #374151; background: #111827; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    /* Холст ридера */
    #reader-screen { display: none; flex-direction: column; align-items: center; padding: 20px; }
    canvas { background: white; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 100%; }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="auth-screen">
    <h2>Цифровая Читальня</h2>
    <p style="font-size:0.9rem; color:#9ca3af;">Введите Email для получения кода доступа:</p>
    
    <input type="email" id="email" placeholder="your@email.com">
    <button onclick="requestCode()">Запросить код</button>
    
    <div id="code-block" style="display:none; margin-top: 15px;">
      <input type="text" id="code" placeholder="6-значный код">
      <button onclick="verifyCode()" style="background:#10b981;">Войти в читальню</button>
    </div>
    <p id="status" style="font-size:0.85rem; color:#f87171; margin-top:10px;"></p>
  </div>

  <!-- Ридер -->
  <div id="reader-screen">
    <div id="canvas-container"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Запрет контекстного меню и горячих клавиш (Ctrl+C, Ctrl+P, Ctrl+S, F12)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['c', 's', 'p', 'u', 'a'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('book') || 'https://hpihtmgbgkcuibssysto.supabase.co/storage/v1/object/public/akeront-media/vektor-bitiy.pdf';

    async function requestCode() {
      const email = document.getElementById('email').value;
      const res = await fetch('/api/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (res.ok) {
        document.getElementById('code-block').style.display = 'block';
        document.getElementById('status').style.color = '#34d399';
        document.getElementById('status').innerText = 'Код отправлен на ваш Email!';
      } else {
        document.getElementById('status').innerText = 'Ошибка отправки кода.';
      }
    }

    async function verifyCode() {
      const email = document.getElementById('email').value;
      const code = document.getElementById('code').value;
      const res = await fetch('/api/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code })
      });

      if (res.ok) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('reader-screen').style.display = 'flex';
        renderPdf(pdfUrl);
      } else {
        document.getElementById('status').style.color = '#f87171';
        document.getElementById('status').innerText = 'Неверный код доступа.';
      }
    }

    async function renderPdf(url) {
      const container = document.getElementById('canvas-container');
      const pdf = await pdfjsLib.getDocument(url).promise;

      for (let num = 1; num <= pdf.numPages; num++) {
        const page = await pdf.getPage(num);
        const viewport = page.getViewport({ scale: 1.5 });
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport }).promise;
        container.appendChild(canvas);
      }
    }
  </script>
</body>
</html>
