<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Читальня — Библиотека Akeront</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* Полный запрет выделения текста */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Модуль авторизации */
    #auth-screen {
      max-width: 420px;
      margin: 100px auto;
      padding: 32px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      text-align: center;
    }
    #auth-screen h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    #status {
      font-size: 0.9rem;
      margin-top: 12px;
    }

    /* Холст защищенного чтения */
    #reader-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }
    canvas {
      background: white;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h2>Цифровая Читальня</h2>
    <p style="color: #94a3b8; font-size: 0.95rem;">Введите Email для получения кода доступа:</p>

    <input type="email" id="email" placeholder="your@email.com">
    <button onclick="requestCode()" id="btn-request">Запросить код</button>

    <div id="code-block" style="display: none; margin-top: 20px;">
      <input type="text" id="code" placeholder="Введите 6-значный код">
      <button onclick="verifyCode()" style="background: #10b981;">Войти в читальню</button>
    </div>

    <div id="status"></div>
  </div>

  <div id="reader-screen">
    <div id="canvas-container"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Блокировка вызова меню по правому клику и горячих клавиш (Ctrl+C, Ctrl+P, Ctrl+S, F12)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['c', 's', 'p', 'u', 'a'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      if (e.key === 'F12') e.preventDefault();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('book');

    async function requestCode() {
      const email = document.getElementById('email').value;
      const status = document.getElementById('status');

      if (!email) {
        status.style.color = '#f87171';
        status.innerText = 'Пожалуйста, введите Email.';
        return;
      }

      status.style.color = '#94a3b8';
      status.innerText = 'Отправка кода...';

      try {
        const res = await fetch('/api/request-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (res.ok) {
          document.getElementById('code-block').style.display = 'block';
          status.style.color = '#34d399';
          status.innerText = 'Код отправлен на ваш Email!';
        } else {
          const err = await res.json();
          status.style.color = '#f87171';
          status.innerText = err.error || 'Ошибка отправки кода.';
        }
      } catch (e) {
        status.style.color = '#f87171';
        status.innerText = 'Ошибка соединения с сервером.';
      }
    }

    async function verifyCode() {
      const email = document.getElementById('email').value;
      const code = document.getElementById('code').value;
      const status = document.getElementById('status');

      try {
        const res = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });

        if (res.ok) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('reader-screen').style.display = 'flex';
          renderPdf(pdfUrl);
        } else {
          status.style.color = '#f87171';
          status.innerText = 'Неверный или устаревший код.';
        }
      } catch (e) {
        status.style.color = '#f87171';
        status.innerText = 'Ошибка проверки кода.';
      }
    }

    async function renderPdf(url) {
      const container = document.getElementById('canvas-container');
      if (!url) {
        container.innerHTML = '<p style="color:#ef4444;">Ошибка: Не указана книга для чтения.</p>';
        return;
      }

      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        container.innerHTML = '';

        for (let num = 1; num <= pdf.numPages; num++) {
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({ scale: 1.5 });

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          container.appendChild(canvas);
        }
      } catch (err) {
        container.innerHTML = '<p style="color:#ef4444;">Не удалось загрузить книгу в защищенном режиме.</p>';
      }
    }
  </script>
</body>
</html>
